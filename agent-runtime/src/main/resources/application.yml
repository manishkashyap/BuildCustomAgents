spring:
  application:
    name: agent-runtime
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/custom_agent_runtime?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:agent_runtime}
    password: ${DB_PASSWORD:runtime_dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8081}

agent-platform:
  credentials:
    # Must be the SAME key agent-management encrypted with; runtime only decrypts.
    encryption-key: ${AGENT_CREDENTIAL_KEY:}
    # How long a credential record is cached, and so the delay on a rotation or a disable.
    cache-ttl: ${AGENT_CREDENTIAL_CACHE_TTL:60s}
    # How early an exchanged token is treated as expired, so a call never races the expiry.
    token-refresh-skew: ${AGENT_CREDENTIAL_TOKEN_SKEW:60s}
  security:
    enabled: ${AGENT_SECURITY_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /openapi
  swagger-ui:
    path: /swagger-ui.html

agents:
  management-datasource:
    url: ${MANAGEMENT_DB_URL:jdbc:mysql://localhost:3306/custom_agent_management?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${MANAGEMENT_DB_USERNAME:agent_management}
    password: ${MANAGEMENT_DB_PASSWORD:management_dev}
    driver-class-name: com.mysql.cj.jdbc.Driver
  execution:
    provider: ${AGENT_RUNTIME_PROVIDER:GOOGLE_GEMINI}
    model: ${AGENT_RUNTIME_MODEL:gemini-3.6-flash}
    max-turns: ${AGENT_RUNTIME_MAX_TURNS:8}
    max-agent-depth: ${AGENT_RUNTIME_MAX_AGENT_DEPTH:3}
    max-agent-invocations: ${AGENT_RUNTIME_MAX_AGENT_INVOCATIONS:10}
  test-runs:
    interaction-token-secret: ${AGENT_TEST_INTERACTION_TOKEN_SECRET:local-draft-test-token-secret-change-me}
    interaction-token-ttl: ${AGENT_TEST_INTERACTION_TOKEN_TTL:30m}
  tools:
    http:
      # Hosts allowed for EVERY tenant. A local-development convenience only - leave empty in a
      # deployed environment and register real destinations per tenant under /api/v1/egress-hosts.
      allowed-hosts: ${AGENT_HTTP_TOOL_ALLOWED_HOSTS:}
      # Lets tools reach loopback/link-local/private addresses. Never enable outside local dev.
      allow-private-networks: ${AGENT_HTTP_TOOL_ALLOW_PRIVATE_NETWORKS:false}
      # How long a tenant's allowlist is cached, and therefore the revocation delay.
      allowlist-cache-ttl: ${AGENT_HTTP_TOOL_ALLOWLIST_CACHE_TTL:30s}
  llm:
    openai:
      enabled: ${OPENAI_ENABLED:false}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      api-key: ${OPENAI_API_KEY:}
      models: ${OPENAI_MODELS:gpt-5.6-sol}
    gemini:
      enabled: ${GEMINI_ENABLED:true}
      base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
      api-key: ${GEMINI_API_KEY:}
      models: ${GEMINI_MODELS:gemini-3.6-flash}
